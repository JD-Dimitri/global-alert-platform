<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>GLOBAL ALERT — The world, live & mapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080f; --panel:#0c1322; --panel2:#111a2d; --line:#1d2940; --text:#e6edf7; --mute:#8a98b3;
  --accent:#2ee6c5; --accent2:#0fb39a; --warn:#f5b301; --crit:#ff4d5e;
  --s0:#8a98b3; --s1:#3b82f6; --s2:#22c55e; --s3:#eab308; --s4:#f97316; --s5:#ef4444;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --tab:58px; --ticker:36px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.h{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:.02em}
#globe{position:fixed;inset:0}
/* Top bar */
#top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(var(--st) + 10px) 14px 26px;
  background:linear-gradient(180deg,rgba(5,8,15,.96) 0%,rgba(5,8,15,.75) 60%,rgba(5,8,15,0) 100%);
  display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.brand svg{flex:none}
.brand small{display:block;font:500 9.5px Inter;color:var(--mute);letter-spacing:.12em;margin-top:1px}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font:600 11.5px Inter;letter-spacing:.06em;border:1px solid var(--line);background:rgba(12,19,34,.8);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.pill.live{border-color:rgba(46,230,197,.4);color:var(--accent)} .pill.live .dot{background:var(--accent);box-shadow:0 0 0 0 rgba(46,230,197,.6);animation:pulse 2s infinite}
.pill.demo{border-color:rgba(245,179,1,.45);color:var(--warn)} .pill.demo .dot{background:var(--warn)}
.pill.off{color:var(--mute)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,230,197,.55)}70%{box-shadow:0 0 0 7px rgba(46,230,197,0)}100%{box-shadow:0 0 0 0 rgba(46,230,197,0)}}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(12,19,34,.85);border:1px solid var(--line)}
.ibtn svg{width:19px;height:19px}
/* Banner */
#banner{position:fixed;z-index:19;left:12px;right:12px;top:calc(var(--st) + 62px);display:none;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.4;
  background:rgba(38,30,6,.94);border:1px solid rgba(245,179,1,.4);color:#f8d77a}
#banner b{color:#ffe39a}
#banner button{float:right;margin-left:8px;color:#ffe39a;font-size:16px;line-height:1}
/* Near me card */
#near{position:fixed;z-index:18;left:12px;top:calc(var(--st) + 62px);display:none;max-width:calc(100% - 80px)}
#near .card{background:rgba(12,19,34,.92);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center}
#near .n{font:700 20px "Space Grotesk",Inter,sans-serif;color:var(--accent)}
/* FAB column */
#fabs{position:fixed;z-index:15;right:12px;bottom:calc(var(--sb) + var(--tab) + var(--ticker) + 14px);display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(12,19,34,.9);border:1px solid #23324f;position:relative}
.fab svg{width:21px;height:21px;color:var(--accent)}
.fab.on{background:var(--accent);border-color:var(--accent)} .fab.on svg{color:#04201b}
.fab .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);font:700 10.5px Inter;display:grid;place-items:center;color:#fff}
/* Ticker */
#ticker{position:fixed;z-index:14;left:0;right:0;bottom:calc(var(--sb) + var(--tab));height:var(--ticker);display:flex;align-items:stretch;background:rgba(9,14,26,.95);border-top:1px solid var(--line)}
#ticker .lab{flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--crit);font:700 11px "Space Grotesk",Inter,sans-serif;letter-spacing:.08em}
#ticker .lab button{font-size:12px;opacity:.9;padding:0 2px}
#tickwrap{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#tick{position:absolute;white-space:nowrap;top:0;bottom:0;display:flex;align-items:center;gap:26px;padding-left:100%;animation:scroll 90s linear infinite}
#tick.paused{animation-play-state:paused}
#tick span{font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
#tick span i{width:7px;height:7px;border-radius:50%;display:inline-block}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
/* Tabs */
#tabs{position:fixed;z-index:21;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);display:flex;background:#070c17;border-top:1px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute)}
#tabs button svg{width:21px;height:21px}
#tabs button.on{color:var(--accent)}
/* Sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;border-top:1px solid var(--line);
  transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sb)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:#2b3a57;margin:9px auto 4px;flex:none}
.sheet header{display:flex;align-items:center;gap:10px;padding:6px 18px 12px;flex:none}
.sheet header h2{margin:0;font-size:20px;flex:1}
.sheet .body{overflow:auto;padding:0 18px 18px;overscroll-behavior:contain}
.sheet footer{flex:none;padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--panel)}
.btn{flex:1;padding:13px 14px;border-radius:13px;font:700 13px "Space Grotesk",Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.btn.pri{background:var(--accent);color:#04201b}
.btn.sec{background:var(--panel2);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.done{color:var(--accent);font-weight:600;padding:7px 12px;border-radius:999px;background:var(--panel2)}
@media(min-width:900px){
  .sheet{left:auto;right:16px;bottom:16px;top:auto;width:420px;border-radius:20px;border:1px solid var(--line);max-height:calc(100vh - 32px)}
  .sheet.on{transform:none}
}
/* Segmented */
.seg{display:flex;background:var(--panel2);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--accent);color:#04201b}
.fam{margin:16px 0 8px;font:600 11.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.group{background:var(--panel2);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.ico svg{width:19px;height:19px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:14.5px}
.row .t small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.row.na{opacity:.55}
.st-live{color:#3ddc97} .st-err{color:var(--crit)} .st-na{color:var(--mute)}
.sw{width:44px;height:26px;border-radius:13px;background:#2a3651;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--c,var(--accent))} .sw.on::after{transform:translateX(18px)}
.sw:disabled{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:600 12px Inter;letter-spacing:.04em}
.chip.on{background:rgba(46,230,197,.14);border-color:var(--accent);color:var(--accent)}
.search{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:15px;outline:none}
.search:focus{border-color:var(--accent)}
.sel{padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit}
/* Event card */
.ev-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{padding:5px 10px;border-radius:7px;font:700 11px "Space Grotesk",Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase}
.ev-title{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.ev-title h3{margin:0;font-size:18px;line-height:1.3}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.note{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.45}
a{color:var(--accent)}
/* Full pages (report, feed, dash, sources) */
.page{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;display:none;padding:calc(var(--st) + 70px) 16px calc(var(--sb) + var(--tab) + 24px)}
.page.on{display:block}
.page .wrap{max-width:820px;margin:0 auto}
.page h1{font-size:24px;margin:0 0 4px}
.page .sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.card2{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card2 h4{margin:0 0 10px;font:600 12px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.feed-item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.feed-item:first-child{border-top:0}
.feed-item b{display:block;font-size:14.5px;line-height:1.35}
.feed-item small{color:var(--mute);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font:700 26px "Space Grotesk",Inter,sans-serif}
.kpi small{color:var(--mute);font-size:12px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.bar .tr{height:9px;border-radius:5px;background:var(--panel2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px}
.bar span:last-child{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;margin-bottom:14px}
.chrono{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.chrono div{position:relative;margin-bottom:12px;font-size:13.5px}
.chrono div::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
/* Markers */
.mk{pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);transition:opacity .2s}
.mk-one{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 3px var(--ring,transparent),0 2px 8px rgba(0,0,0,.5)}
.mk-one svg{width:13px;height:13px;color:#fff}
.mk-one.urg{animation:urg 1.6s infinite}
@keyframes urg{0%,100%{box-shadow:0 0 0 3px var(--ring),0 0 0 3px rgba(239,68,68,.6)}50%{box-shadow:0 0 0 3px var(--ring),0 0 0 11px rgba(239,68,68,0)}}
.mk-cl{min-width:32px;height:32px;padding:0 7px;border-radius:16px;display:grid;place-items:center;font:700 13px "Space Grotesk",Inter,sans-serif;color:#fff;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(0,0,0,.55)}
.mk-me{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 0 0 6px rgba(46,230,197,.25)}
#tip{position:fixed;z-index:40;pointer-events:none;background:rgba(12,19,34,.95);border:1px solid var(--line);padding:6px 9px;border-radius:9px;font-size:12px;display:none;max-width:240px}
#pickhint{position:fixed;z-index:22;left:50%;transform:translateX(-50%);top:calc(var(--st) + 66px);background:var(--accent);color:#04201b;font-weight:600;font-size:13px;padding:9px 14px;border-radius:999px;display:none}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
#loading div{text-align:center;color:var(--mute);font-size:13px}
#loading svg{animation:spin 2.4s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:7px;background:var(--panel2)}
.legend i{width:9px;height:9px;border-radius:50%}
</style>
